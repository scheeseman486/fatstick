# Linux and Windows are built on Linux; macOS needs a macOS runner because the
# Apple SDK licence forbids using it on other hardware. The three builds don't
# wait for the tests, so a failing test doesn't hold up an installer; the
# macOS job runs the tests that exercise its own code (audio engine, library,
# and the app's backend with a sync to a disk image).
#
# The bundled ffmpeg (packaging/ffmpeg/build-ffmpeg.sh) takes a few minutes per
# target, so it is cached, keyed on the script: a new FFmpeg or LAME version
# changes the script and so rebuilds it.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push cancels the build still running for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System packages (FAT tools, ffmpeg for fixtures and checks, Xvfb, Tauri, ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools fatsort fdisk gdisk exfatprogs ntfs-3g e2fsprogs \
            ffmpeg xvfb nasm libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libasound2-dev
      - uses: actions/cache@v4
        with:
          path: app/src-tauri/binaries/ff*-x86_64-unknown-linux-gnu
          key: ffmpeg-linux-${{ hashFiles('packaging/ffmpeg/build-ffmpeg.sh') }}
      - name: Bundled ffmpeg (Linux)
        run: |
          [ -x app/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu ] ||
            packaging/ffmpeg/build-ffmpeg.sh x86_64-unknown-linux-gnu
      # The tests find the bundled ffmpeg in app/src-tauri/binaries, as the app does.
      - run: cargo test --workspace
      - name: The audio engine against the distribution's ffmpeg too (people may swap theirs in)
        run: FATSTICK_FFMPEG_DIR=/usr/bin cargo test -p fatstick-audio
      - run: cargo build --workspace
      - name: End-to-end tests on disk images with awkward prior layouts
        run: python3 tests/stick_e2e.py
      - name: Helper sidecar (the app's build needs it present)
        run: cp target/debug/fatstick-helper app/src-tauri/binaries/fatstick-helper-x86_64-unknown-linux-gnu
      - name: The app's backend tests (a sync to a disk image, the player)
        run: cargo test --manifest-path app/src-tauri/Cargo.toml
      - name: The app end to end (a debug build under Xvfb, then the image read by fsck.fat, mtools, ffprobe)
        run: |
          cargo build --manifest-path app/src-tauri/Cargo.toml
          python3 tests/app_e2e.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The window's own tests (name rules; the UI in headless Chromium)
        run: |
          node tests/ui_names.js
          node tests/ui_search.js
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/ui_check.js

  linux-and-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,x86_64-pc-windows-msvc
      - name: System packages (Tauri on Linux; mingw, NSIS and LLVM for Windows; nasm for ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libasound2-dev gcc-mingw-w64-x86-64 nsis lld llvm clang nasm
          cargo install --locked cargo-xwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            app/src-tauri/binaries/ff*-x86_64-unknown-linux-gnu
            app/src-tauri/binaries/ff*-x86_64-pc-windows-*.exe
          key: ffmpeg-linux-windows-${{ hashFiles('packaging/ffmpeg/build-ffmpeg.sh') }}
      - name: Bundled ffmpeg (Linux, and Windows with mingw)
        run: |
          B=app/src-tauri/binaries
          [ -x $B/ffmpeg-x86_64-unknown-linux-gnu ] || packaging/ffmpeg/build-ffmpeg.sh x86_64-unknown-linux-gnu
          [ -f $B/ffmpeg-x86_64-pc-windows-msvc.exe ] || packaging/ffmpeg/build-ffmpeg.sh x86_64-pc-windows-gnu
      - name: Helper sidecars
        run: |
          cargo build --release -p fatstick-helper
          cargo build --release -p fatstick-helper --target x86_64-pc-windows-gnu
          mkdir -p app/src-tauri/binaries
          cp target/release/fatstick-helper app/src-tauri/binaries/fatstick-helper-x86_64-unknown-linux-gnu
          # The helper is a standalone exe, so the mingw build serves the MSVC-built app too.
          cp target/x86_64-pc-windows-gnu/release/fatstick-helper.exe app/src-tauri/binaries/fatstick-helper-x86_64-pc-windows-msvc.exe
      - name: Linux bundles (.deb, .rpm, AppImage)
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@^2 build
      - name: Windows installer (NSIS) from Linux, Tauri's documented cargo-xwin route
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --runner cargo-xwin --target x86_64-pc-windows-msvc
      - name: The FFmpeg and LAME sources, for the LGPL source offer
        run: |
          mkdir -p sources
          git -C target/ffmpeg-build/x86_64-unknown-linux-gnu/ffmpeg archive --prefix=ffmpeg-n9.0.2/ -o "$PWD/sources/ffmpeg-n9.0.2.tar.gz" HEAD
          cp target/ffmpeg-build/x86_64-unknown-linux-gnu/lame-3.100.tar.gz sources/
        # On a cache hit the sources weren't fetched; the build script fetches them.
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: |
            app/src-tauri/target/release/bundle/
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
            sources/

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Apple Silicon only, for now (the build script and Tauri can also make
      # x86_64 or universal builds).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: nasm (for the ffmpeg build) and ffmpeg (the tests make their fixtures with it)
        run: brew install nasm ffmpeg
      - uses: actions/cache@v4
        with:
          path: app/src-tauri/binaries/ff*-aarch64-apple-darwin
          key: ffmpeg-macos-arm64-${{ hashFiles('packaging/ffmpeg/build-ffmpeg.sh') }}
      - name: Bundled ffmpeg (Apple Silicon)
        run: |
          [ -x app/src-tauri/binaries/ffmpeg-aarch64-apple-darwin ] ||
            packaging/ffmpeg/build-ffmpeg.sh aarch64-apple-darwin
          app/src-tauri/binaries/ffmpeg-aarch64-apple-darwin -hide_banner -version | head -1
          lipo -info app/src-tauri/binaries/ffmpeg-aarch64-apple-darwin
      - name: Apple Silicon .app and .dmg (ad-hoc signed)
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --target aarch64-apple-darwin
        # For a Developer ID signature and notarization, set APPLE_CERTIFICATE,
        # APPLE_SIGNING_IDENTITY, APPLE_API_KEY etc. as Tauri documents.
      - name: Keep the .app's permissions (artifact zips drop them)
        run: |
          cd app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          tar czf Fatstick.app.tar.gz Fatstick.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Fatstick.app.tar.gz
      - name: Tests on macOS, after the upload so a failure doesn't hold up the build (FAT writer, audio engine, library; the app's sync and player)
        run: |
          cargo test -p fatstick-core -p fatstick-audio -p fatstick-library
          cargo test --manifest-path app/src-tauri/Cargo.toml
