[package]
name = "fatstick-helper"
description = "Privileged helper for Fatstick: reorders one FAT directory on one removable volume"
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately tiny: no option-parsing library, validates its own target.
[dependencies]
fatstick-core.workspace = true
fatstick-device.workspace = true
serde.workspace = true
serde_json.workspace = true

# Build-script dependencies follow the *host*, so this is unconditional and
# build.rs checks the target OS itself (cross-compiling from Linux works).
[build-dependencies]
embed-manifest = "1.4"
