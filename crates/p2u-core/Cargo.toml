[package]
name = "p2u-core"
description = "Playlist parsing, ordered copy and FAT directory-entry reordering for Playlist2USB"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
quick-xml = "0.38"
percent-encoding = "2"
encoding_rs = "0.8"
unicode-normalization = "0.1"
deunicode = "1"
filetime = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
