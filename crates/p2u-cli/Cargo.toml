[package]
name = "p2u-cli"
description = "Command-line front end for Playlist2USB"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "p2u"
path = "src/main.rs"

[dependencies]
p2u-core.workspace = true
p2u-device.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
