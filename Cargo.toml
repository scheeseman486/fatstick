[workspace]
resolver = "2"
members = [
    "crates/fatstick-core",
    "crates/fatstick-device",
    "crates/fatstick-cli",
    "crates/fatstick-helper",
    "crates/fatstick-audio",
    "crates/fatstick-library",
    "crates/fatstick-stretch",
]
# The Tauri shell lives in app/src-tauri and is its own workspace member when
# its system dependencies (webkit2gtk-4.1 on Linux) are installed:
#   cargo build --manifest-path app/src-tauri/Cargo.toml
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
fatstick-core = { path = "crates/fatstick-core" }
fatstick-device = { path = "crates/fatstick-device" }
fatstick-audio = { path = "crates/fatstick-audio" }
fatstick-library = { path = "crates/fatstick-library" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
