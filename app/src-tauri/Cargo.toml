[package]
name = "playlist2usb"
description = "Copy a playlist to a FAT32 USB stick in the order cheap players use"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p2u-core = { path = "../../crates/p2u-core" }
p2u-device = { path = "../../crates/p2u-device" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
