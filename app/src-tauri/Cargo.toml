[package]
name = "fatstick"
description = "Music player and playlist organizer that also writes FAT32 USB sticks in the order cheap players use"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fatstick-core = { path = "../../crates/fatstick-core" }
fatstick-device = { path = "../../crates/fatstick-device" }
fatstick-audio = { path = "../../crates/fatstick-audio" }
fatstick-library = { path = "../../crates/fatstick-library" }
fatstick-youtube = { path = "../../crates/fatstick-youtube" }
cpal = "0.16"
# Watching the music folder for changes.
notify = "8"

[dev-dependencies]
tempfile = "3"
id3 = "1.17"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
