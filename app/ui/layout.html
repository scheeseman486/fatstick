<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stick layout</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="layout-page">
  <main class="lay" id="lay" aria-live="polite">
    <p class="st-note">Waiting for the main window…</p>
  </main>
  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="modal-back" id="modal-back" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <script src="js/ui.js"></script>
  <script src="js/link.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
