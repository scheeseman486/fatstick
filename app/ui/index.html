<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fatstick</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="display" id="display">
        <div class="glass" aria-live="polite" aria-atomic="true">
          <div class="disp-main">
            <span class="seg ghost" aria-hidden="true">~~~~~~~~~~~~~~~~</span>
            <span class="seg" id="disp-text"></span>
          </div>
          <div class="disp-side">
            <span class="disp-count">
              <span class="seg ghost" aria-hidden="true">~~~</span>
              <span class="seg" id="disp-count"></span>
            </span>
            <span class="seg disp-unit" id="disp-unit">TRK</span>
            <span class="disp-time">
              <span class="seg ghost" aria-hidden="true">~~~~~~~</span>
              <span class="seg" id="disp-time"></span>
            </span>
          </div>
        </div>
        <p class="disp-sub" id="disp-sub"></p>
      </div>
      <div class="top-tools">
        <button type="button" class="ghost-btn" id="lib-btn" aria-pressed="false" title="Your music folder: browse, search and tag it">Library</button>
        <button type="button" class="ghost-btn" id="app-menu" data-menu-anchor aria-haspopup="menu">Menu</button>
      </div>
    </header>

    <nav class="side" id="side" aria-label="Playlists and sticks"></nav>

    <main class="main" id="main">
      <div class="pl-head" id="pl-head"></div>
      <div class="list-wrap" id="list-wrap">
        <div class="list-cols" id="list-cols" aria-hidden="true"></div>
        <div class="list" id="list" role="listbox" aria-multiselectable="true" tabindex="0" aria-label="Tracks"></div>
        <div class="drop-line" id="drop-line" hidden></div>
        <div class="list-empty" id="list-empty" hidden></div>
      </div>
      <p class="list-foot" id="list-foot"></p>
    </main>

    <aside class="stick" id="stick" aria-label="Stick"></aside>

    <section class="libview" id="libview" aria-label="Music library" hidden></section>

    <footer class="player" id="player" aria-label="Player"></footer>
  </div>

  <div class="drag-badge" id="drag-badge" hidden></div>
  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="modal-back" id="modal-back" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>
  <input type="file" id="file-in" multiple hidden accept="audio/*,.mp3,.flac,.m4a,.aac,.ogg,.opus,.wma,.wav,.aiff,.aif,.wv,.ape,.m3u,.m3u8,.xspf,.pls">
  <input type="file" id="folder-in" hidden webkitdirectory>

  <script src="js/ui.js"></script>
  <script src="js/names.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/search.js"></script>
  <script src="js/sniff.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/link.js"></script>
  <script src="js/api.js"></script>
  <script src="js/library.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
